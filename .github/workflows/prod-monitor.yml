name: Production monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prod-monitor.yml
      - scripts/smoke-prod.ps1

concurrency:
  group: prod-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke-prod.ps1
          sparse-checkout-cone-mode: false
      - name: Smoke test (retries once to ignore transient blips)
        shell: pwsh
        run: |
          ./scripts/smoke-prod.ps1
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Host "Retrying in 60s..."
          Start-Sleep -Seconds 60
          ./scripts/smoke-prod.ps1
          exit $LASTEXITCODE
